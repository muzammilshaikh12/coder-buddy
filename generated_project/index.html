<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="todo-app">
    <h1>Todo App</h1>
    <form id="todo-form">
      <input id="new-todo" type="text" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list" class="todo-list"></ul>
    <!-- Template for a single todo item -->
    <template id="todo-item-template">
      <li class="todo-item" draggable="true" data-id="{{id}}">
        <input type="checkbox" class="toggle-complete">
        <label class="todo-label"></label>
        <input class="edit-input" type="text" hidden>
        <button class="delete-btn" aria-label="Delete todo">✕</button>
      </li>
    </template>
    <div class="filters">
      <button data-filter="all" class="filter-btn active">All</button>
      <button data-filter="active" class="filter-btn">Active</button>
      <button data-filter="completed" class="filter-btn">Completed</button>
    </div>
    <footer>
      <small>Made with ❤️ by Your Name</small>
    </footer>
  </div>
</body>
</html>
